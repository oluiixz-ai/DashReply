name: Process Instagram scheduled posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-scheduled-publishing
  cancel-in-progress: false

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Process due Instagram posts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub Actions secret: CRON_SECRET"
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://dash-reply-2der.vercel.app/api/cron/publish-content-schedule"
